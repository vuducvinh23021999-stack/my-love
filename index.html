<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chuyện Tình Yêu</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Dancing+Script:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#fce4ec 0,#fff0f5 30%,#fce4ec 70%,#fff0f5 100%);min-height:100vh;color:#333;overflow-x:hidden}
.header{text-align:center;padding:40px 20px 30px;position:relative}
.header h1{font-family:'Dancing Script',cursive;font-size:42px;color:#c2185b;margin-bottom:6px}
.header p{font-size:15px;color:#888;font-weight:300;letter-spacing:1px}
.header .qr-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:16px}
.header .qr-wrap img{width:120px;height:120px;border-radius:12px;box-shadow:0 2px 15px rgba(0,0,0,.1)}
.header .qr-wrap .url-text{font-size:11px;color:#aaa;word-break:break-all;max-width:300px}
.container{max-width:800px;margin:0 auto;padding:10px 20px 60px}
.timeline{position:relative;padding:20px 0}
.timeline::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:3px;background:linear-gradient(to bottom,transparent,#e91e63,#e91e63,transparent);transform:translateX(-50%);border-radius:3px}
.entry{display:flex;align-items:flex-start;margin-bottom:50px;position:relative;opacity:0;transform:translateY(30px);transition:all .6s ease}
.entry.show{opacity:1;transform:translateY(0)}
.entry.left{flex-direction:row;padding-right:calc(50% + 30px)}
.entry.right{flex-direction:row-reverse;padding-left:calc(50% + 30px)}
.dot{position:absolute;left:50%;top:20px;width:18px;height:18px;background:#e91e63;border:4px solid white;border-radius:50%;transform:translateX(-50%);z-index:2;box-shadow:0 2px 10px rgba(233,30,99,.3)}
.card{background:white;border-radius:16px;padding:20px;width:100%;box-shadow:0 4px 25px rgba(0,0,0,.08);position:relative;transition:transform .3s}
.card:hover{transform:translateY(-3px)}
.card .date{font-size:11px;color:#e91e63;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.card h3{font-family:'Playfair Display',serif;font-size:18px;color:#333;margin-bottom:6px}
.card p{font-size:13.5px;color:#666;line-height:1.7;margin-bottom:14px}
.card .img-wrap{width:100%;border-radius:12px;overflow:hidden;background:#fafafa}
.card .img-wrap img{width:100%;display:block;border-radius:12px;transition:transform .5s}
.card .img-wrap img:hover{transform:scale(1.03)}
.hearts{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
.heart{position:absolute;font-size:20px;opacity:.12;animation:floatHeart linear infinite}
@keyframes floatHeart{0%{transform:translateY(100vh) rotate(0) scale(.5);opacity:0}10%{opacity:.12}90%{opacity:.12}100%{transform:translateY(-10vh) rotate(720deg) scale(1);opacity:0}}
.footer{text-align:center;padding:30px;color:#aaa;font-size:13px;font-style:italic}
@media(max-width:640px){
.header h1{font-size:32px}
.timeline::before{left:20px}
.entry{flex-direction:row!important;padding:0!important;padding-left:50px!important;margin-bottom:35px}
.dot{left:20px;width:14px;height:14px;top:14px}
.card{padding:16px}
.card h3{font-size:16px}
}
</style>
</head>
<body>

<div class="hearts" id="hearts"></div>

<header class="header">
  <h1>Chuyện Tình Yêu</h1>
  <p>Những khoảnh khắc ngọt ngào của tụi mình ❤️</p>
  <div class="qr-wrap">
    <img id="qrImg" alt="QR code">
    <div class="url-text" id="urlDisplay"></div>
  </div>
</header>

<div class="container">
  <div class="timeline" id="timeline"></div>
</div>

<div class="footer">Mãi mãi bên nhau ❤️</div>

<script>
const entries = [
  {
    date: '01/01/2024',
    title: 'Ngày đầu tiên bên nhau',
    desc: 'Khoảnh khắc đầu tiên tụi mình chính thức thuộc về nhau. Anh nhớ mãi nụ cười của em hôm đó.',
    image: 'https://drive.google.com/thumbnail?id=1Ikxvt0z55qzAM70kmI86dh3DrvOR6F_q&sz=w1000'
  }
];

function render() {
  const el = document.getElementById('timeline');
  entries.forEach((e, i) => {
    const side = i % 2 === 0 ? 'left' : 'right';
    const img = e.image
      ? `<div class="img-wrap"><img src="${e.image}" alt="${e.title}" loading="lazy" onerror="this.parentElement.innerHTML='<div style=\\'padding:40px;text-align:center;color:#ccc\\'>📷</div>'"></div>`
      : '';
    el.innerHTML += `
      <div class="entry ${side}" data-idx="${i}">
        <div class="dot"></div>
        <div class="card">
          <div class="date">${e.date}</div>
          <h3>${e.title}</h3>
          <p>${e.desc}</p>
          ${img}
        </div>
      </div>`;
  });
  setTimeout(observe, 100);
}

function observe() {
  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('show'); });
  }, { threshold: .15 });
  document.querySelectorAll('.entry').forEach(el => observer.observe(el));
}

function createHearts() {
  const c = document.getElementById('hearts');
  const symbols = ['❤️','💕','💗','💖','💝','🌸'];
  for (let i = 0; i < 20; i++) {
    const h = document.createElement('span');
    h.className = 'heart';
    h.textContent = symbols[i % symbols.length];
    h.style.left = Math.random() * 100 + '%';
    h.style.fontSize = (12 + Math.random() * 20) + 'px';
    h.style.animationDuration = (10 + Math.random() * 15) + 's';
    h.style.animationDelay = (Math.random() * 20) + 's';
    c.appendChild(h);
  }
}

(function init() {
  var url = window.location.href;
  document.getElementById('urlDisplay').textContent = url;
  document.getElementById('qrImg').src = 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=' + encodeURIComponent(url);
  createHearts();
  render();
})();
</script>
</body>
</html>
