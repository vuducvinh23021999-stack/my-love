<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chuyện Tình Yêu</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Dancing+Script:wght@400;700&family=Inter:wght@300;400;500&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;overflow-x:hidden;color:#333;background:#0d0d1a}

/* INTRO */
.intro{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:#0d0d1a;transition:opacity 1.2s ease,visibility 1.2s ease}
.intro.hide{opacity:0;visibility:hidden;pointer-events:none}
.intro-inner{text-align:center;animation:introFade 2s ease forwards}
@keyframes introFade{0%{opacity:0;transform:scale(.8)}100%{opacity:1;transform:scale(1)}}
.intro .icon{font-size:64px;margin-bottom:16px;animation:heartBeat 1.5s ease infinite}
@keyframes heartBeat{0%,100%{transform:scale(1)}10%{transform:scale(1.2)}20%{transform:scale(1)}30%{transform:scale(1.15)}40%{transform:scale(1)}}
.intro h1{font-family:'Dancing Script',cursive;font-size:48px;color:white;margin-bottom:8px}
.intro p{color:rgba(255,255,255,.4);font-size:14px;letter-spacing:3px;text-transform:uppercase;margin-bottom:24px}
.intro .btn-open{background:linear-gradient(135deg,#e91e63,#c2185b);border:none;color:white;padding:14px 48px;border-radius:50px;font-size:15px;cursor:pointer;transition:transform .3s,box-shadow .3s;box-shadow:0 4px 30px rgba(233,30,99,.3)}
.intro .btn-open:hover{transform:scale(1.05);box-shadow:0 8px 50px rgba(233,30,99,.4)}

#bg-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.scroll-progress{position:fixed;top:0;left:0;width:0;height:3px;background:linear-gradient(90deg,#e91e63,#ff6b9d,#c2185b);z-index:999;transition:width .1s;border-radius:0 2px 2px 0}

.header{text-align:center;padding:100px 20px 50px;position:relative;z-index:1;opacity:0;transform:translateY(40px);transition:all 1s ease}
.header.show{opacity:1;transform:translateY(0)}
.header .days-badge{display:inline-block;padding:12px 32px;background:rgba(255,255,255,.04);backdrop-filter:blur(20px);border-radius:50px;border:1px solid rgba(255,255,255,.08);margin-bottom:28px;font-family:'Space Grotesk',sans-serif;position:relative}
.header .days-badge .num{font-size:42px;font-weight:700;background:linear-gradient(135deg,#ff6b9d,#c2185b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-1px}
.header .days-badge .lbl{display:block;font-size:11px;color:rgba(255,255,255,.4);letter-spacing:3px;text-transform:uppercase;margin-top:2px}
.header h1{font-family:'Dancing Script',cursive;font-size:56px;color:white;margin-bottom:8px;text-shadow:0 0 60px rgba(233,30,99,.2)}
.header p{font-size:15px;color:rgba(255,255,255,.35);font-weight:300;letter-spacing:3px;text-transform:uppercase}
.header .qr-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:28px;opacity:.5;transition:opacity .3s}
.header .qr-wrap:hover{opacity:1}
.header .qr-wrap img{width:80px;height:80px;border-radius:10px;box-shadow:0 4px 30px rgba(0,0,0,.3)}
.header .qr-wrap .url-text{font-size:10px;color:rgba(255,255,255,.25);word-break:break-all;max-width:280px}

.container{max-width:860px;margin:0 auto;padding:20px 24px 100px;position:relative;z-index:1}
.timeline{position:relative;padding:30px 0}
.timeline::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:linear-gradient(to bottom,transparent,rgba(233,30,99,.2),rgba(233,30,99,.2),transparent);transform:translateX(-50%)}

.entry{display:flex;align-items:flex-start;margin-bottom:70px;position:relative;opacity:0;transform:translateY(80px) rotateX(10deg);transition:all 1s cubic-bezier(.22,1,.36,1);transform-origin:top center;perspective:1000px}
.entry.show{opacity:1;transform:translateY(0) rotateX(0)}
.entry.left{flex-direction:row;padding-right:calc(50% + 40px)}
.entry.right{flex-direction:row-reverse;padding-left:calc(50% + 40px)}

.entry .dot-wrap{position:absolute;left:50%;top:28px;transform:translateX(-50%);z-index:3;display:flex;align-items:center;justify-content:center;width:44px;height:44px}
.entry .dot{width:12px;height:12px;background:#e91e63;border-radius:50%;box-shadow:0 0 30px rgba(233,30,99,.4);transition:all .8s;position:relative}
.entry .dot::before{content:'';position:absolute;inset:-8px;border-radius:50%;border:1.5px solid rgba(233,30,99,.15);animation:pulse 3s ease-in-out infinite}
.entry .dot::after{content:'';position:absolute;inset:-16px;border-radius:50%;border:1px solid rgba(233,30,99,.08);animation:pulse 3s ease-in-out infinite;animation-delay:.5s}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.5);opacity:0}}
.entry.show .dot{background:#ff6b9d;box-shadow:0 0 50px rgba(233,30,99,.6)}

.card{background:rgba(255,255,255,.03);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:28px;width:100%;box-shadow:0 8px 50px rgba(0,0,0,.25);position:relative;transition:transform .5s cubic-bezier(.22,1,.36,1),box-shadow .5s;transform-style:preserve-3d;cursor:pointer}
.card:hover{transform:translateY(-8px) scale(1.01);box-shadow:0 20px 80px rgba(0,0,0,.35)}
.card .date{font-size:10px;color:#ff6b9d;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;margin-bottom:6px;font-family:'Space Grotesk',sans-serif}
.card h3{font-family:'Playfair Display',serif;font-size:20px;color:white;margin-bottom:8px;font-weight:600}
.card p{font-size:14px;color:rgba(255,255,255,.5);line-height:1.8;margin-bottom:16px;font-weight:300}
.card .img-wrap{width:100%;border-radius:14px;overflow:hidden;background:rgba(0,0,0,.3);position:relative;transform:translateZ(0);cursor:pointer}
.card .img-wrap img{width:100%;display:block;border-radius:14px;transition:transform .8s}
.card .img-wrap:hover img{transform:scale(1.08)}

/* CONFETTI */
.confetti-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:998;overflow:hidden}
.confetti-piece{position:absolute;width:8px;height:8px;top:-10px;opacity:0;animation:confettiFall linear forwards}
@keyframes confettiFall{0%{opacity:1;transform:translateY(-10px) rotate(0) scale(1)}100%{opacity:0;transform:translateY(100vh) rotate(720deg) scale(0)}}

/* LIGHTBOX */
.lightbox{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.9);backdrop-filter:blur(40px);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all .4s;cursor:zoom-out}
.lightbox.active{opacity:1;visibility:visible}
.lightbox img{max-width:90vw;max-height:90vh;border-radius:16px;transform:scale(.9);transition:transform .5s;box-shadow:0 20px 100px rgba(0,0,0,.5)}
.lightbox.active img{transform:scale(1)}
.lightbox .lb-close{position:absolute;top:24px;right:24px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.08);border:none;color:white;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .3s}
.lightbox .lb-close:hover{background:rgba(255,255,255,.15)}
.lightbox .lb-count{position:absolute;bottom:30px;color:rgba(255,255,255,.3);font-size:13px;letter-spacing:2px}
.lightbox .lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.06);border:none;color:white;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .3s}
.lightbox .lb-nav:hover{background:rgba(255,255,255,.12)}
.lightbox .lb-prev{left:20px}
.lightbox .lb-next{right:20px}

.particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
.particle{position:absolute;font-size:12px;opacity:0;animation:particleFloat linear forwards}
@keyframes particleFloat{0%{opacity:1;transform:translateY(0) scale(1) rotate(0)}100%{opacity:0;transform:translateY(-180px) scale(0) rotate(540deg)}}

.footer{text-align:center;padding:40px;color:rgba(255,255,255,.2);font-family:'Dancing Script',cursive;font-size:22px;letter-spacing:1px}

@media(max-width:680px){
.intro h1{font-size:34px}
.intro .icon{font-size:48px}
.header{padding:80px 16px 30px}
.header h1{font-size:36px}
.header .days-badge .num{font-size:28px}
.timeline::before{left:20px}
.entry{flex-direction:row!important;padding:0!important;padding-left:56px!important;margin-bottom:50px}
.entry .dot-wrap{left:20px;width:34px;height:34px;top:20px}
.entry .dot{width:10px;height:10px}
.card{padding:20px}
.card h3{font-size:17px}
.lightbox .lb-prev{left:8px;width:36px;height:36px}
.lightbox .lb-next{right:8px;width:36px;height:36px}
}
</style>
</head>
<body>

<!-- INTRO -->
<div class="intro" id="intro">
  <div class="intro-inner">
    <div class="icon">💖</div>
    <h1>Chuyện Tình Yêu</h1>
    <p>25 • 07 • 2026</p>
    <button class="btn-open" onclick="openTimeline()">Mở trang</button>
  </div>
</div>

<canvas id="bg-canvas"></canvas>
<div class="scroll-progress" id="scrollProgress"></div>
<div class="confetti-container" id="confetti"></div>
<div class="particles" id="particles"></div>
<div class="lightbox" id="lightbox" onclick="closeLB()">
  <button class="lb-close">&times;</button>
  <button class="lb-nav lb-prev" id="lbPrev">&#10094;</button>
  <img id="lbImg" src="" alt="">
  <button class="lb-nav lb-next" id="lbNext">&#10095;</button>
  <div class="lb-count" id="lbCount"></div>
</div>

<header class="header" id="header">
  <div class="days-badge">
    <div class="num" id="dayCount">0</div>
    <div class="lbl">Ngày bên nhau</div>
  </div>
  <h1>Chuyện Tình Yêu</h1>
  <p>Những khoảnh khắc ngọt ngào của tụi mình</p>
  <div class="qr-wrap">
    <img id="qrImg" alt="QR code">
    <div class="url-text" id="urlDisplay"></div>
  </div>
</header>

<div class="container">
  <div class="timeline" id="timeline"></div>
</div>

<div class="footer">Mãi mãi bên nhau ❤️</div>

<script>
// ===== DATA =====
var entries = [
  { date: '23/07/2023', title: 'Ngày đầu tiên bên nhau', desc: 'Khoảnh khắc đầu tiên tụi mình chính thức thuộc về nhau.', image: 'https://drive.google.com/thumbnail?id=1Ikxvt0z55qzAM70kmI86dh3DrvOR6F_q&sz=w1000' },
  { date: '23/07/2023', title: 'Nụ cười của em', desc: 'Khoảnh khắc em cười tươi, anh thấy cả thế giới như ngừng lại.', image: 'https://drive.google.com/thumbnail?id=1xKPkbDWODDvhyT40NomMhe6sopVyMhki&sz=w1000' },
  { date: '23/07/2023', title: 'Bên nhau', desc: 'Những phút giây bình yên khi có em kề bên.', image: 'https://drive.google.com/thumbnail?id=1eMJWxuT4zgj0QBXCPldJzT7jsSdPIbTn&sz=w1000' },
  { date: '23/07/2023', title: 'Kỷ niệm', desc: 'Không có gì quý giá hơn những khoảnh khắc này.', image: 'https://drive.google.com/thumbnail?id=1oaojJQceutsOOmS6iD4OK_KLjEJh5bY_&sz=w1000' },
  { date: '23/07/2023', title: 'Dành cho em', desc: 'Từng ánh nhìn, từng cử chỉ đều dành cho em.', image: 'https://drive.google.com/thumbnail?id=10dzrSGrXJTCtKJpYYJKKpXOhDLRNL_OT&sz=w1000' },
  { date: '23/07/2023', title: 'Hạnh phúc', desc: 'Hạnh phúc là khi được nhìn em cười mỗi ngày.', image: 'https://drive.google.com/thumbnail?id=1awJVlAYPIp5H8TJiBe3ZqEJMtwqdILHK&sz=w1000' },
  { date: '23/07/2023', title: 'Yêu thương', desc: 'Tụi mình - một câu chuyện tình yêu đẹp nhất.', image: 'https://drive.google.com/thumbnail?id=1F-RAUIVJ9mau9OIayKagcSfjHdqMJeaZ&sz=w1000' },
  { date: '23/07/2023', title: 'Ánh mắt ấy', desc: 'Ánh mắt em luôn làm anh say đắm.', image: 'https://drive.google.com/thumbnail?id=1F8vNQ32qbxQ17zwTwQKpbUVQwAciM9fI&sz=w1000' },
  { date: '14/02/2024', title: 'Valentine đầu tiên', desc: 'Món quà nhỏ nhưng cả hai đều trân trọng.', image: 'https://drive.google.com/thumbnail?id=1J9_DPKSoyUu9y7q_0DmcSEUtwI6HGNCK&sz=w1000' },
  { date: '23/07/2024', title: 'Kỷ niệm 1 năm', desc: 'Một năm bên nhau, tràn ngập tiếng cười.', image: 'https://drive.google.com/thumbnail?id=1CgYSdYyjz1re45k6-mj2Pi5VKQiB8HbX&sz=w1000' },
  { date: '27/07/2026', title: 'Hôm nay', desc: 'Vẫn là anh và em, vẫn yêu thương như ngày đầu. ❤️', image: 'https://drive.google.com/thumbnail?id=1OFpBRhytGGz_pdQmtY-EX2Z-h_orz5MW&sz=w1000' }
];

// ===== INTRO =====
function openTimeline() {
  var intro = document.getElementById('intro');
  intro.classList.add('hide');
  document.getElementById('header').classList.add('show');
  fireConfetti();
  setTimeout(render, 600);
}

// ===== BG CANVAS =====
(function bg() {
  var c = document.getElementById('bg-canvas'), ctx = c.getContext('2d'), w, h, t = 0;
  function resize() { w = c.width = window.innerWidth; h = c.height = window.innerHeight; }
  window.addEventListener('resize', resize); resize();
  function draw() {
    t += 0.002;
    var g = ctx.createRadialGradient(w / 2 + Math.sin(t) * 120, h / 2 + Math.cos(t * 0.6) * 80, 0, w / 2, h / 2, w * 0.75);
    g.addColorStop(0, 'hsla(' + (340 + Math.sin(t * 0.4) * 12) + ',80%,50%,0.12)');
    g.addColorStop(0.25, 'hsla(' + (320 + Math.sin(t * 0.3 + 2) * 15) + ',70%,30%,0.08)');
    g.addColorStop(0.6, 'hsla(260,40%,12%,0.06)');
    g.addColorStop(1, '#0d0d1a');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    requestAnimationFrame(draw);
  }
  draw();
})();

// ===== SCROLL PROGRESS =====
window.addEventListener('scroll', function () {
  var p = window.scrollY / (document.documentElement.scrollHeight - window.innerHeight);
  document.getElementById('scrollProgress').style.width = (p * 100) + '%';
});

// ===== DAYS COUNTER =====
(function countDays() {
  var start = new Date(2023, 6, 23), now = new Date();
  var days = Math.floor((now - start) / 86400000);
  var el = document.getElementById('dayCount'), i = 0;
  (function anim() {
    if (i < days) { el.textContent = i.toLocaleString(); i += Math.max(1, Math.floor(days / 60)); setTimeout(anim, 30); }
    else { el.textContent = days.toLocaleString(); }
  })();
})();

// ===== CONFETTI =====
function fireConfetti() {
  var c = document.getElementById('confetti');
  var colors = ['#e91e63','#ff6b9d','#c2185b','#ff4081','#f48fb1','#ce93d8','#ba68c8'];
  for (var i = 0; i < 80; i++) {
    var p = document.createElement('span');
    p.className = 'confetti-piece';
    p.style.left = Math.random() * 100 + '%';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.width = (4 + Math.random() * 8) + 'px';
    p.style.height = (4 + Math.random() * 8) + 'px';
    p.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    p.style.animationDuration = (2 + Math.random() * 3) + 's';
    p.style.animationDelay = (Math.random() * 2) + 's';
    c.appendChild(p);
    setTimeout(function () { if (p.parentNode) p.parentNode.removeChild(p); }, 6000);
  }
}

// ===== BURST =====
function burst(x, y) {
  var c = document.getElementById('particles');
  var symbols = ['❤️','💕','💗','💖','✨'];
  for (var i = 0; i < 15; i++) {
    var p = document.createElement('span');
    p.className = 'particle';
    p.textContent = symbols[i % symbols.length];
    p.style.left = (x + (Math.random() - 0.5) * 30) + 'px';
    p.style.top = (y + (Math.random() - 0.5) * 30) + 'px';
    p.style.animationDuration = (0.8 + Math.random() * 0.8) + 's';
    c.appendChild(p);
    setTimeout(function () { if (p.parentNode) p.parentNode.removeChild(p); }, 2000);
  }
}

// ===== LIGHTBOX =====
var lbIdx = 0;
function openLB(idx) {
  lbIdx = idx;
  var e = document.getElementById('lightbox');
  document.getElementById('lbImg').src = entries[idx].image + '&sz=w1600';
  document.getElementById('lbCount').textContent = (idx + 1) + ' / ' + entries.length;
  document.getElementById('lbPrev').style.display = idx > 0 ? 'flex' : 'none';
  document.getElementById('lbNext').style.display = idx < entries.length - 1 ? 'flex' : 'none';
  e.classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closeLB() {
  document.getElementById('lightbox').classList.remove('active');
  document.body.style.overflow = '';
}
document.getElementById('lbPrev').addEventListener('click', function (e) { e.stopPropagation(); if (lbIdx > 0) openLB(lbIdx - 1); });
document.getElementById('lbNext').addEventListener('click', function (e) { e.stopPropagation(); if (lbIdx < entries.length - 1) openLB(lbIdx + 1); });
document.getElementById('lightbox').querySelector('.lb-close').addEventListener('click', closeLB);
document.addEventListener('keydown', function (e) {
  if (!document.getElementById('lightbox').classList.contains('active')) return;
  if (e.key === 'Escape') closeLB();
  if (e.key === 'ArrowLeft' && lbIdx > 0) openLB(lbIdx - 1);
  if (e.key === 'ArrowRight' && lbIdx < entries.length - 1) openLB(lbIdx + 1);
});

// ===== RENDER =====
function render() {
  var el = document.getElementById('timeline');
  entries.forEach(function (e, i) {
    var side = i % 2 === 0 ? 'left' : 'right';
    var img = e.image
      ? '<div class="img-wrap" onclick="event.stopPropagation();openLB(' + i + ')"><img src="' + e.image + '" alt="' + e.title + '" loading="lazy"></div>'
      : '';
    el.innerHTML +=
      '<div class="entry ' + side + '" data-idx="' + i + '">' +
      '<div class="dot-wrap"><div class="dot"></div></div>' +
      '<div class="card" onclick="openLB(' + i + ')">' +
      '<div class="date">' + e.date + '</div>' +
      '<h3>' + e.title + '</h3>' +
      '<p>' + e.desc + '</p>' +
      img +
      '</div>' +
      '</div>';
  });
  setTimeout(observe, 200);
}

function observe() {
  var observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) {
        e.target.classList.add('show');
        var r = e.target.getBoundingClientRect();
        burst(r.left + r.width / 2, r.top + 30);
      }
    });
  }, { threshold: 0.1 });
  document.querySelectorAll('.entry').forEach(function (el) { observer.observe(el); });
}

// ===== 3D TILT =====
document.addEventListener('mousemove', function (e) {
  document.querySelectorAll('.card').forEach(function (card) {
    var r = card.getBoundingClientRect();
    var x = (e.clientX - r.left) / r.width - 0.5;
    var y = (e.clientY - r.top) / r.height - 0.5;
    card.style.transform = 'perspective(800px) rotateY(' + (x * 3) + 'deg) rotateX(' + (-y * 3) + 'deg)';
  });
});
document.addEventListener('mouseleave', function () {
  document.querySelectorAll('.card').forEach(function (c) { c.style.transform = ''; });
});

// ===== QR CODE =====
(function init() {
  var url = window.location.href;
  document.getElementById('urlDisplay').textContent = url;
  document.getElementById('qrImg').src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(url);
})();
</script>
</body>
</html>
