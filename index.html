<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chuyện Tình Yêu</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Dancing+Script:wght@400;700&family=Inter:wght@300;400;500&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;overflow-x:hidden;color:#333;background:#1a1a2e}
#bg-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.scroll-progress{position:fixed;top:0;left:0;width:0;height:3px;background:linear-gradient(90deg,#e91e63,#ff6b9d,#c2185b);z-index:999;transition:width .1s;border-radius:0 2px 2px 0}

.header{text-align:center;padding:80px 20px 50px;position:relative;z-index:1}
.header .days-badge{display:inline-block;padding:10px 28px;background:rgba(255,255,255,.06);backdrop-filter:blur(20px);border-radius:50px;border:1px solid rgba(255,255,255,.1);margin-bottom:24px;font-family:'Space Grotesk',sans-serif}
.header .days-badge .num{font-size:36px;font-weight:700;background:linear-gradient(135deg,#ff6b9d,#c2185b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header .days-badge .lbl{display:block;font-size:11px;color:rgba(255,255,255,.5);letter-spacing:2px;text-transform:uppercase;margin-top:2px}
.header h1{font-family:'Dancing Script',cursive;font-size:52px;color:white;margin-bottom:8px;text-shadow:0 0 40px rgba(233,30,99,.3)}
.header p{font-size:15px;color:rgba(255,255,255,.5);font-weight:300;letter-spacing:2px}
.header .qr-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:24px}
.header .qr-wrap img{width:100px;height:100px;border-radius:12px;box-shadow:0 4px 30px rgba(0,0,0,.3);opacity:.7;transition:opacity .3s}
.header .qr-wrap img:hover{opacity:1}
.header .qr-wrap .url-text{font-size:10px;color:rgba(255,255,255,.3);word-break:break-all;max-width:280px}

.container{max-width:820px;margin:0 auto;padding:20px 24px 80px;position:relative;z-index:1}
.timeline{position:relative;padding:30px 0}
.timeline::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,transparent,rgba(233,30,99,.4),rgba(233,30,99,.4),transparent);transform:translateX(-50%)}

.entry{display:flex;align-items:flex-start;margin-bottom:60px;position:relative;opacity:0;transform:translateY(80px);transition:all .9s cubic-bezier(.22,1,.36,1)}
.entry.show{opacity:1;transform:translateY(0)}
.entry.left{flex-direction:row;padding-right:calc(50% + 36px)}
.entry.right{flex-direction:row-reverse;padding-left:calc(50% + 36px)}
.entry .dot-wrap{position:absolute;left:50%;top:24px;transform:translateX(-50%);z-index:3;display:flex;align-items:center;justify-content:center;width:40px;height:40px}
.entry .dot{width:14px;height:14px;background:#e91e63;border-radius:50%;box-shadow:0 0 20px rgba(233,30,99,.5);transition:all .5s;position:relative}
.entry .dot::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:1.5px solid rgba(233,30,99,.2);animation:pulse 2.5s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.4);opacity:0}}
.entry.show .dot{background:#ff6b9d;box-shadow:0 0 30px rgba(233,30,99,.6)}

.card{background:rgba(255,255,255,.04);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:28px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.2);position:relative;transition:transform .4s cubic-bezier(.22,1,.36,1),box-shadow .4s}
.card:hover{transform:translateY(-6px);box-shadow:0 16px 60px rgba(0,0,0,.3)}
.card .date{font-size:11px;color:#ff6b9d;font-weight:600;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;font-family:'Space Grotesk',sans-serif}
.card h3{font-family:'Playfair Display',serif;font-size:20px;color:white;margin-bottom:8px}
.card p{font-size:14px;color:rgba(255,255,255,.55);line-height:1.8;margin-bottom:16px;font-weight:300}
.card .img-wrap{width:100%;border-radius:14px;overflow:hidden;background:rgba(0,0,0,.2);position:relative;transform:translateZ(0)}
.card .img-wrap img{width:100%;display:block;border-radius:14px;transition:transform .6s}
.card .img-wrap:hover img{transform:scale(1.05)}

.particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
.particle{position:absolute;font-size:14px;opacity:0;animation:particleFloat linear forwards}
@keyframes particleFloat{0%{opacity:1;transform:translateY(0) scale(1) rotate(0)}100%{opacity:0;transform:translateY(-200px) scale(0) rotate(360deg)}}

.footer{text-align:center;padding:40px;color:rgba(255,255,255,.3);font-size:13px;font-style:italic;font-family:'Dancing Script',cursive;font-size:20px}

@media(max-width:680px){
.header{padding:60px 16px 30px}
.header h1{font-size:36px}
.header .days-badge .num{font-size:28px}
.timeline::before{left:20px}
.entry{flex-direction:row!important;padding:0!important;padding-left:56px!important;margin-bottom:40px}
.entry .dot-wrap{left:20px;width:32px;height:32px}
.entry .dot{width:12px;height:12px}
.card{padding:20px}
.card h3{font-size:17px}
}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="scroll-progress" id="scrollProgress"></div>
<div class="particles" id="particles"></div>

<header class="header">
  <div class="days-badge">
    <div class="num" id="dayCount">0</div>
    <div class="lbl">Ngày bên nhau</div>
  </div>
  <h1>Chuyện Tình Yêu</h1>
  <p>Những khoảnh khắc ngọt ngào của tụi mình</p>
  <div class="qr-wrap">
    <img id="qrImg" alt="QR code">
    <div class="url-text" id="urlDisplay"></div>
  </div>
</header>

<div class="container">
  <div class="timeline" id="timeline"></div>
</div>

<div class="footer">Mãi mãi bên nhau ❤️</div>

<script>
const entries = [
  {
    date: '23/07/2023',
    title: 'Ngày đầu tiên bên nhau',
    desc: 'Khoảnh khắc đầu tiên tụi mình chính thức thuộc về nhau. Anh nhớ mãi nụ cười của em hôm đó.',
    image: 'https://drive.google.com/thumbnail?id=1Ikxvt0z55qzAM70kmI86dh3DrvOR6F_q&sz=w1000'
  },
  {
    date: '15/08/2023',
    title: 'Buổi hẹn đầu tiên',
    desc: 'Cùng nhau đi ăn, đi dạo và cười suốt cả buổi. Khoảng thời gian thật nhẹ nhàng và hạnh phúc.',
    image: 'https://drive.google.com/thumbnail?id=1Ikxvt0z55qzAM70kmI86dh3DrvOR6F_q&sz=w1000'
  },
  {
    date: '20/09/2023',
    title: 'Kỷ niệm ngày mưa',
    desc: 'Cơn mưa bất chợt nhưng có em bên cạnh, anh thấy chẳng có gì tuyệt vời hơn.',
    image: 'https://drive.google.com/thumbnail?id=1Ikxvt0z55qzAM70kmI86dh3DrvOR6F_q&sz=w1000'
  },
  {
    date: '14/02/2024',
    title: 'Valentine đầu tiên',
    desc: 'Món quà nhỏ nhưng cả hai đều trân trọng. Yêu em nhiều!',
    image: 'https://drive.google.com/thumbnail?id=1Ikxvt0z55qzAM70kmI86dh3DrvOR6F_q&sz=w1000'
  },
  {
    date: '23/07/2024',
    title: 'Kỷ niệm 1 năm',
    desc: 'Một năm bên nhau, tràn ngập tiếng cười và hạnh phúc. Cảm ơn em vì tất cả!',
    image: 'https://drive.google.com/thumbnail?id=1Ikxvt0z55qzAM70kmI86dh3DrvOR6F_q&sz=w1000'
  },
  {
    date: '27/07/2026',
    title: 'Hôm nay',
    desc: 'Vẫn là anh và em, vẫn yêu thương như ngày đầu. Yêu em! ❤️',
    image: 'https://drive.google.com/thumbnail?id=1Ikxvt0z55qzAM70kmI86dh3DrvOR6F_q&sz=w1000'
  }
];

// Animated gradient background
(function bgCanvas() {
  var c = document.getElementById('bg-canvas');
  var ctx = c.getContext('2d');
  var w, h, t = 0;
  function resize() { w = c.width = window.innerWidth; h = c.height = window.innerHeight; }
  window.addEventListener('resize', resize); resize();
  function draw() {
    t += 0.002;
    var g = ctx.createRadialGradient(w/2 + Math.sin(t)*100, h/2 + Math.cos(t*0.7)*80, 0, w/2, h/2, w*0.7);
    var hue1 = 340 + Math.sin(t*0.5)*10;
    var hue2 = 320 + Math.sin(t*0.3 + 2)*15;
    g.addColorStop(0, 'hsla('+hue1+',80%,50%,0.15)');
    g.addColorStop(0.3, 'hsla('+hue2+',70%,30%,0.1)');
    g.addColorStop(0.7, 'hsla(250,40%,15%,0.08)');
    g.addColorStop(1, '#1a1a2e');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    requestAnimationFrame(draw);
  }
  draw();
})();

// Scroll progress
window.addEventListener('scroll', function() {
  var p = window.scrollY / (document.documentElement.scrollHeight - window.innerHeight);
  document.getElementById('scrollProgress').style.width = (p * 100) + '%';
});

// Days counter
(function countDays() {
  var start = new Date(2023, 6, 23);
  var now = new Date();
  var days = Math.floor((now - start) / (1000 * 60 * 60 * 24));
  var el = document.getElementById('dayCount');
  var i = 0;
  function anim() {
    if (i <= days) { el.textContent = i.toLocaleString(); i += Math.max(1, Math.floor(days / 80)); setTimeout(anim, 30); }
    else { el.textContent = days.toLocaleString(); }
  }
  anim();
})();

// Burst particles on card appear
function burst(x, y) {
  var c = document.getElementById('particles');
  var symbols = ['❤️','💕','💗','💖','✨'];
  for (var i = 0; i < 12; i++) {
    var p = document.createElement('span');
    p.className = 'particle';
    p.textContent = symbols[i % symbols.length];
    p.style.left = (x + (Math.random() - 0.5) * 40) + 'px';
    p.style.top = (y + (Math.random() - 0.5) * 40) + 'px';
    p.style.animationDuration = (0.8 + Math.random() * 0.8) + 's';
    var angle = Math.random() * Math.PI * 2;
    var dist = 60 + Math.random() * 120;
    p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
    p.style.animation = 'none';
    c.appendChild(p);
    requestAnimationFrame(function() {
      p.style.animation = 'particleFloat ' + (0.8 + Math.random() * 0.8) + 's forwards';
    });
    setTimeout(function() { if (p.parentNode) p.parentNode.removeChild(p); }, 2000);
  }
}

// Render timeline
function render() {
  var el = document.getElementById('timeline');
  entries.forEach(function(e, i) {
    var side = i % 2 === 0 ? 'left' : 'right';
    var img = e.image
      ? '<div class="img-wrap"><img src="' + e.image + '" alt="' + e.title + '" loading="lazy" onerror="this.parentElement.innerHTML=\'<div style=\\\'padding:40px;text-align:center;color:rgba(255,255,255,.2)\\\'>📷</div>\'"></div>'
      : '';
    el.innerHTML +=
      '<div class="entry ' + side + '" data-idx="' + i + '">' +
        '<div class="dot-wrap"><div class="dot"></div></div>' +
        '<div class="card">' +
          '<div class="date">' + e.date + '</div>' +
          '<h3>' + e.title + '</h3>' +
          '<p>' + e.desc + '</p>' +
          img +
        '</div>' +
      '</div>';
  });
  setTimeout(observe, 150);
}

function observe() {
  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) {
      if (e.isIntersecting) {
        e.target.classList.add('show');
        var rect = e.target.getBoundingClientRect();
        burst(rect.left + rect.width/2, rect.top + 40);
      }
    });
  }, { threshold: 0.12 });
  document.querySelectorAll('.entry').forEach(function(el) { observer.observe(el); });
}

// 3D tilt on cards
document.addEventListener('mousemove', function(e) {
  document.querySelectorAll('.card').forEach(function(card) {
    var rect = card.getBoundingClientRect();
    var x = (e.clientX - rect.left) / rect.width - 0.5;
    var y = (e.clientY - rect.top) / rect.height - 0.5;
    card.style.transform = 'perspective(800px) rotateY(' + (x * 4) + 'deg) rotateX(' + (-y * 4) + 'deg) translateY(-3px)';
  });
});
document.addEventListener('mouseleave', function() {
  document.querySelectorAll('.card').forEach(function(card) {
    card.style.transform = '';
  });
});

// Init
(function init() {
  var url = window.location.href;
  document.getElementById('urlDisplay').textContent = url;
  document.getElementById('qrImg').src = 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=' + encodeURIComponent(url);
  render();
})();
</script>
</body>
</html>
